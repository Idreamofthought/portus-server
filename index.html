<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portus</title>

  <!-- Ambience + Game CSS -->
  <link rel="stylesheet" href="/css/ambience-payments.css">
  <link rel="stylesheet" href="/css/game.css">
</head>

<body>

  <!-- Time Remaining -->
  <div id="time-remaining" class="time-box"></div>

  <!-- Audio Controls -->
  <div id="audio-controls"></div>

  <!-- Notifications -->
  <div id="notifications"></div>

  <!-- Building Buttons -->
  <div id="buildings"></div>

  <!-- Panel Toggles -->
  <div id="panel-buttons">
    <button id="panel-resources">Resources</button>
    <button id="panel-research">Research</button>
    <button id="panel-codex">Codex</button>
    <button id="panel-warnings">Warnings</button>
    <button id="panel-disasters">Disasters</button>
    <button id="panel-favour">Favour</button>
  </div>

  <!-- Panel Boxes -->
  <div id="panel-resources-box"></div>
  <div id="panel-research-box"></div>
  <div id="panel-codex-box"></div>
  <div id="panel-warnings-box"></div>
  <div id="panel-disasters-box"></div>
  <div id="panel-favour-box"></div>

  <!-- Game Canvas (if needed later) -->
  <canvas id="gameCanvas" width="900" height="600"></canvas>

  <!-- Main Game Script -->
  <script type="module" src="./main.js"></script>

</body>
</html>
