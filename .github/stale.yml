days-before-issue-stale: 45
days-before-issue-close: 14
days-before-pr-stale: 30
days-before-pr-close: 14
stale-issue-label: stale
stale-pr-label: stale
remove-stale-when-updated: true
exempt-draft-pr: true
exempt-all-milestones: true
exempt-issue-labels:
  - pinned
  - security
exempt-pr-labels:
  - pinned
  - security
mark-issue-message: >-
  This issue has been marked as stale because it has been inactive for 45 days.
  Reply with an update or remove the stale conditions and it will stay open.
close-issue-message: >-
  Closing this issue because it has been stale for 14 more days without a follow-up.
  Comment again if there is still work to do and it can be reopened.
mark-pr-message: >-
  This pull request has been marked as stale because it has been inactive for 30 days.
  Reply or push updates to keep it active.
close-pr-message: >-
  Closing this pull request because it has been stale for 14 more days without a follow-up.
  Push new commits or comment if the work should continue.
operations-per-run: 200
ascending: true
