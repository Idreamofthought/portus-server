days-before-issue-stale: 45
days-before-issue-close: 14
days-before-pr-stale: 30
days-before-pr-close: 14
stale-issue-label: stale
stale-pr-label: stale
remove-stale-when-updated: true
exempt-draft-pr: true
exempt-all-milestones: true
exempt-issue-labels:
  - pinned
  - security
exempt-pr-labels:
  - pinned
  - security
mark-issue-message: >-
  Daydream marked this issue as stale because it has been inactive for 45 days.
  Reply with an update and Daydream will keep it open.
close-issue-message: >-
  Daydream is closing this issue because it stayed stale for 14 more days without a follow-up.
  Comment again if there is still work to do and Daydream can help reopen the thread.
mark-pr-message: >-
  Daydream marked this pull request as stale because it has been inactive for 30 days.
  Reply or push updates and Daydream will keep it active.
close-pr-message: >-
  Daydream is closing this pull request because it stayed stale for 14 more days without a follow-up.
  Push new commits or comment if the work should continue.
operations-per-run: 200
ascending: true
