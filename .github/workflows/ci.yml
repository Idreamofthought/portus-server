name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
        env:
          # Dummy values, not real credentials: STRIPE_SECRET_KEY only needs to be
          # truthy for the local Stripe SDK client to initialize (webhook signature
          # verification is a local crypto operation, no network calls), and
          # STRIPE_WEBHOOK_SECRET is used to both sign and verify fabricated test
          # events locally -- see test/integration/stripe-webhook.spec.js.
          STRIPE_SECRET_KEY: sk_test_ci_dummy_not_real
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_not_real

      - name: Validate repository structure
        run: npm run validate:structure

  deploy:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "RAILWAY_TOKEN is not configured; skipping deployment."
            exit 0
          fi
          railway up --detach