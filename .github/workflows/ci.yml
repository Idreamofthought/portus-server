name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
        env:
          # Dummy values, not real credentials: these are only required for local
          # SDK initialization and webhook-signature validation in CI. No network
          # calls are made to Stripe, PayPal, or Resend during the test run.
          STRIPE_SECRET_KEY: sk_test_ci_dummy_not_real
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_not_real
          PAYPAL_CLIENT_ID: paypal_ci_dummy_client_id
          PAYPAL_CLIENT_SECRET: paypal_ci_dummy_client_secret
          PAYPAL_WEBHOOK_ID: wh_1234567890_ci_dummy
          RESEND_API_KEY: re_ci_dummy_not_real
          EMAIL_FROM: Portus CI <ci@example.com>

      - name: Validate repository structure
        run: npm run validate:structure

  deploy:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "RAILWAY_TOKEN is not configured; skipping deployment."
            exit 0
          fi
          railway up --detach