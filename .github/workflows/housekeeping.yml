name: Daydream Housekeeping

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
    - cron: "41 5 * * 1"

concurrency:
  group: housekeeping-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-labels:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * *' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync housekeeping labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('.github/housekeeping.json', 'utf8'));

            for (const label of config.labels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (existing.color !== label.color || (existing.description || '') !== label.description) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  core.info(`Updated label: ${label.name}`);
                } else {
                  core.info(`Label already up to date: ${label.name}`);
                }
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Created label: ${label.name}`);
              }
            }

  stale:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * *' }}
    needs: sync-labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark and close stale conversations
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          config-path: .github/stale.yml

  structure-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '41 5 * * 1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository structure
        run: npm run validate:structure
