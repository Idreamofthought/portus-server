  <div class="container">
    <h1>Youth</h1>

    <div class="intro">
    <p>Gone its flame gone</p>

    <p>Never there those angry days now</p>

    <p>The refusal to listen to authority</p>

    <p>I pass to my children</p>

    <p>Always question and discuss</p>

    <p>Keep an open mind</p>

    <p>But know yours too.</p>
