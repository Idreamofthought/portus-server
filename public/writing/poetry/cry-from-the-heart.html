  <div class="container">
    <h1>Cry from the heart</h1>

    <div class="intro">
    <p>Some words now</p>

    <p>For you to stop and read</p>

    <p>Step by idle step</p>

    <p>Dust on the sheet</p>

    <p>Raindrops which spread</p>

    <p>How my broken heart bleeds</p>

    <p>Its merry way to hell</p>

    <p>Stuck on this wall</p>

    <p>Walk on to find</p>

    <p>Heat from the heart.</p>
    </div>
