    <h1>Time to go</h1>

    <div class="intro">
    <p>We wait for the clock</p>

    <p>For the time to come</p>

    <p>Waiting for the train</p>

    <p>Chasing the sun round</p>

    <p>Time to go.</p>

    <p>Floyd was bang on.</p>
