    <h1>12</h1>
    <p class="meta small-note">2016-04-12 — Poetry · NaPoWriMo — Tags: NaPoWriMo, time, stars</p>

    <div class="intro">
    <p>A dozen</p>

    <p>Clean disciples or dirty jurors</p>

    <p>Pennies in a shilling</p>

    <p>Long since spent</p>

    <p>All my life in a coin</p>

    <p>Passed over 1000 years</p>

    <p>Kings and lions</p>

    <p>Given up for new.</p>

    <p>&nbsp;</p>
