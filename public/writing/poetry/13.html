    <h1>13</h1>
    <p class="meta small-note">2016-04-13 — Poetry · NaPoWriMo — Tags: NaPoWriMo, transplant, hope</p>

    <div class="intro">
    <p>Baker's dozen</p>

    <p>Added extra for luck</p>

    <p>The day before the transplant</p>

    <p>The day of novelty</p>

    <p>Time spent</p>

    <p>Time</p>

    <p>Come up for air.</p>
