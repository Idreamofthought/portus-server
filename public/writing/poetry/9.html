    <h1>9</h1>
    <p class="meta small-note">2016-04-09 — Poetry · NaPoWriMo — Tags: NaPoWriMo, rain, road</p>

    <div class="intro">
    <p>Motorbikes</p>

    <p>Reflected in the rain</p>

    <p>Droplets shining</p>

    <p>The road  shining in the sun</p>

    <p>Reflecting in the sky</p>

    <p>Mirrored oil</p>

    <p>Round the road for hope.</p>

    <p>&nbsp;</p>
