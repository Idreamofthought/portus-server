    <h1>17</h1>
    <p class="meta small-note">2016-04-17 — Poetry · NaPoWriMo — Tags: NaPoWriMo, spring, nature</p>

    <div class="intro">
    <p>Frost in April</p>

    <p>Shrug off cold</p>

    <p>Leafs curl open</p>

    <p>Catch the Sun's rays</p>

    <p>Turn photons to carbohydrates</p>

    <p>Grow up from the still Earth</p>

    <p>First gasp green</p>

    <p>Spring.</p>

    <p>&nbsp;</p>
