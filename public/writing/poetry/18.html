    <h1>18</h1>
    <p class="meta small-note">2016-04-18 — Poetry · NaPoWriMo — Tags: NaPoWriMo, spring, nature</p>

    <div class="intro">
    <p>Cherry blossom</p>

    <p>Blue sky</p>

    <p>Cold frost</p>

    <p>Sun’s shadows</p>

    <p>Filtered through thought</p>

    <p>What fruit comes</p>

    <p>We don’t know</p>

    <p>Pass on the good stuff</p>

    <p>Pass on the bad stuff</p>

    <p>Pass on.</p>
