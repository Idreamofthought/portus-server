    <h1>8</h1>
    <p class="meta small-note">2016-04-08 — Poetry · NaPoWriMo — Tags: NaPoWriMo, nature</p>

    <div class="intro">
    <p>Yellow buds</p>

    <p>Lilacs forsythia and daffodils flower at the same time</p>

    <p>Even if this sounds strange</p>

    <p>Warm winter</p>

    <p>Buds yet to break</p>

    <p>Maybe next time</p>

    <p>Or never.</p>

    <p>Eaten or broken</p>

    <p>Yet the tree lives.</p>

    <p>&nbsp;</p>
