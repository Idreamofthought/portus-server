    <h1>28</h1>
    <p class="meta small-note">2016-04-28 — Poetry · NaPoWriMo — Tags: NaPoWriMo, poetry</p>

    <div class="intro">
    <p>The magpie, clumsy in its grace</p>

    <p>Hops and bows, flitters wings</p>

    <p>Jabs jumps in every place</p>

    <p>Stealing rings from stoney Kings</p>

    <p>Steals the crown from off their heads</p>

    <p>And flies away to branched beds.</p>
